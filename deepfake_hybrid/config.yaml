# Paths
output_root: "./outputs"

# Frame extraction
frame_sampling_fps: 5
max_frames_per_video: 100   # Canonical runs used 100 (verified: test split ~66-82 frames/video, impossible at 50)
image_size: 224

# Training
batch_size: 64           # Per step; effective batch 128 with accum_steps=2 (matches Tabel 3.11). vast_run.sh auto-tunes by VRAM (32/64/128).
num_workers: 2
lr: 2.0e-4
weight_decay: 1.0e-4
epochs: 30                 # Max epochs — early stopping handles actual duration
early_stop_patience: 12    # Extra buffer around backbone unfreeze boundary
accum_steps: 2             # Gradient accumulation for all models
label_smoothing: 0.05      # Light smoothing — prevents overconfidence on small training sets
fusion_mode: two_branch
n_seeds: 3

# Frequency branch
freq_depth: 5              # FreqCNN conv blocks: 3 (~130K params) or 5 (~4.2M params with base=64)
freq_base_channels: 64     # Channels in first conv block (64 for face crops, 32 for full scenes)
fft_noise_sigma: 0.05      # Gaussian noise sigma for FFT augmentation (0 to disable)

# Dataset roots
datasets:
  ffpp:
    root: "./dataset/face_forensics"
    real_keywords: ["original", "real", "pristine", "actors", "youtube"]
    fake_keywords: ["fake", "manipulated", "deepfakes", "faceswap", "neuraltextures", "deepfakedetection", "faceshifter", "face2face"]
  cdf:
    root: "./dataset/celeb_df"
    real_keywords: ["real", "authentic"]
    fake_keywords: ["fake", "synthesis", "deepfake"]

